name: OpenWrt APK

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Parser and stream tests
        run: ./scripts/test.sh
      - name: Install SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget curl zstd
      - name: Build APK for OpenWrt 25.12.6
        env:
          JOBS: '2'
        run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sacnmon-openwrt-25.12.6-mipsel_24kc
          path: artifacts/
          if-no-files-found: error
