name: OpenWrt APK

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Parser and stream tests
        run: ./scripts/test.sh
      - name: Build APK for OpenWrt 25.12.6
        env:
          JOBS: '2'
        run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sacnmon-openwrt-25.12.6-mipsel_24kc
          path: artifacts/
          if-no-files-found: error
